name: Android CI

on:
  push:
    branches: [ main, "feature/p2-17-autonomous-ai-ad-interaction" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure preinstalled Android SDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch pinned llama.cpp source
        run: |
          chmod +x scripts/fetch_llama_cpp.sh
          scripts/fetch_llama_cpp.sh

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Compile Android instrumentation tests
        run: gradle :app:assembleDebugAndroidTest

      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-ad-skip-debug-android-test-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-ad-skip-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
