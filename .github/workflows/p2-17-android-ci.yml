name: P2.17 Android CI

on:
  push:
    branches:
      - feature/p2-17-autonomous-ai-ad-interaction
  pull_request:
    branches:
      - feature/p2-16-stable-accessibility-node-match
      - feature/p2-17-autonomous-ai-ad-interaction
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-17-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-ad-skip-p2-17-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
